name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check engine tools tests
      - name: Type check
        run: mypy engine/wattmosaic_engine || true
      - name: Contract schemas are current
        run: |
          python tools/dev/export_schemas.py
          git diff --exit-code data/schemas
      - name: Published validation docs are current
        run: python tools/dev/render_validation_docs.py --check
      - name: Deployment install path is intact
        run: bash scripts/validate_addon.sh --no-build
      - name: Tests
        run: pytest -q

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No live-install audit files are tracked
        run: |
          bad=$(git ls-files | grep -E '^data/(ha_environment_audit|entity_inventory|device_inventory|ct_update_profile|state_entity_candidates|topology_candidates|real_ha_validation|initial_mapping_candidates)\.json$|^data/entity_registry(|_slim)\.json$|^data/raw/|^data/passive/' || true)
          if [ -n "$bad" ]; then echo "::error::live audit data is tracked: $bad"; exit 1; fi
          echo "no live audit data tracked"
      - name: Committed fixtures are synthetic
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = pathlib.Path("data/examples/reference_house")
          audit = json.loads((d / "ha_environment_audit.json").read_text())
          # A synthetic fixture must declare itself as such, and must not carry
          # hardware identifiers.
          blob = json.dumps(audit).lower()
          for banned in ("mac_address", "serial", "config_entry_id"):
              if banned in blob:
                  sys.exit(f"::error::fixture carries {banned}")
          print("fixtures look synthetic")
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure no .env or secrets are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is tracked"; exit 1; fi
          # Delegate to the repository scanner instead of an inline grep.  An
          # inline pattern like 'ghp_|github_pat_' also matches the source of
          # the scanner itself and this workflow, so it can never pass; the
          # scanner matches complete token shapes and has documented allowlist
          # markers.  Same check as the `secret_scan` gate in verify.py.
          python tools/dev/check_secrets.py

  integration-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate integration manifest JSON
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("custom_components/wattmosaic/manifest.json")
          data = json.loads(p.read_text())
          assert data["domain"] == "wattmosaic"
          assert data["config_flow"] is True
          print("manifest ok", data["version"])
          PY
      - name: Validate add-on config
        run: |
          python - <<'PY'
          import yaml, pathlib
          data = yaml.safe_load(pathlib.Path("addon/config.yaml").read_text())
          for key in ("name", "slug", "version", "options", "schema", "arch"):
              assert key in data, key
          print("addon ok", data["version"])
          PY

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HACS / Marketplace publication
        run: python tools/dev/check_hacs.py
      - name: HACS action (integration)
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  release:
    # The release contract: every place that states a version agrees, the
    # current version is documented, and the branch carries a version of its
    # own kind (stable on main, prerelease on dev).  This is the gate that
    # would have caught fifteen published versions with no git tag behind them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version fields agree and the current version is documented
        run: python tools/dev/check_release.py
      - name: This branch carries a version of its own kind
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: python tools/dev/check_release.py --channel "${{ github.ref_name }}"
