[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattmosaic-engine"
version = "0.2.0-dev4"
description = "WattMosaic load disaggregation engine: multi-CT home energy inference and self-learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WattMosaic" }]
dependencies = [
  "pydantic>=2.6,<3",
  "aiohttp>=3.9,<4",
  "websockets>=12,<16",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
wattmosaic-engine = "wattmosaic_engine.main:main"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["wattmosaic_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["custom_components", "addon", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  # Contracts use ``class X(str, Enum)`` on purpose: Pydantic serialises the
  # *value* only for str-subclasses, and the JSON schemas in data/schemas are
  # generated from them.  StrEnum would change the generated schema text.
  "UP042",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
